<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}} · {{BRAND}} {{BRAND_NOTE}}</title>
<meta name="description" content="{{SUMMARY}}" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body id="top" data-page="post" data-section="{{SECTION}}" data-post="{{SLUG}}">
<div class="sky"><canvas id="sky" aria-hidden="true"></canvas></div>
<div class="bg-glow"><i class="g1"></i><i class="g2"></i></div>
<script src="assets/sky.js" defer></script>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/"><span class="mark">w</span>{{BRAND}}<small>{{BRAND_NOTE}}</small></a>
    <nav class="nav"><!-- 由 site.js 按分区配置生成，当前分区用 ?s= 指定 --></nav>
    <div class="top-right">
      <button class="kbtn" onclick="location.href='/'">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.4-3.4"/></svg>
        搜索
        <kbd>Ctrl K</kbd>
      </button>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="展开导航" aria-expanded="false">
        <i></i><i></i><i></i>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- ============ 文章头 ============ -->
  <div class="page-head">
    <div class="crumbs">
      {{CRUMB}}
    </div>
    <h1>{{TITLE}}</h1>
    <div class="meta-row">
      {{META}}
    </div>
  </div>

  <div class="post-wrap">
    <!-- ============ 正文 ============ -->
    <article class="prose">
{{BODY}}
    </article>

    <!-- ============ 目录 ============ -->
    <aside class="toc">
      <div class="h">// 本文目录</div>
      <ol id="toc">
{{TOC}}
      </ol>
    </aside>
  </div>

  <!-- ============ 上下篇 ============ -->
  <nav class="post-nav">
{{POST_NAV}}
  </nav>

  <!-- ============ 评论 ============ -->
  <section class="comments" id="comments" hidden>
    <div class="c-head">
      <h2>评论<span class="c-count" id="cCount"></span></h2>
      <span class="c-hint">匿名留言，说点什么都行</span>
    </div>

    <div class="c-list" id="cList"></div>
    <p class="c-empty" id="cEmpty">还没有人说话。沙发空着。</p>

    <form class="c-form" id="cForm" autocomplete="off">
      <div class="c-row">
        <input id="cName" name="name" type="text" maxlength="20" placeholder="昵称（最多 20 字）" required />
        <button type="submit" id="cSend">发表</button>
      </div>
      <textarea id="cBody" name="body" maxlength="1000" rows="4" placeholder="想说什么…（纯文本，回车换行）" required></textarea>
      <div class="c-hp"><input id="cHp" name="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" /></div>
      <p class="c-msg" id="cMsg"></p>
    </form>
  </section>
</main>

<footer>
  <div class="foot-in">
    <div class="l"><span class="dot"></span>{{BRAND}} · 个人档案 · 手写 HTML，无框架</div>
    <div class="links" id="footLinks"></div>
  </div>
</footer>

<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="assets/comments.js"></script>
<script>
(function () {
  'use strict';

  /* 目录高亮（scroll spy） */
  var links = Array.prototype.slice.call(document.querySelectorAll('#toc a'));
  var targets = links.map(function (a) { return document.querySelector(a.getAttribute('href')); });

  function spy() {
    var pos = window.scrollY + 120;
    var idx = -1;
    targets.forEach(function (t, i) {
      if (t && t.offsetTop <= pos) idx = i;
    });
    links.forEach(function (a, i) { a.classList.toggle('on', i === idx); });
  }
  window.addEventListener('scroll', spy, { passive: true });
  spy();

  /* 目录平滑滚动 */
  links.forEach(function (a) {
    a.addEventListener('click', function (e) {
      var t = document.querySelector(a.getAttribute('href'));
      if (!t) return;
      e.preventDefault();
      window.scrollTo({ top: t.offsetTop - 80, behavior: 'smooth' });
    });
  });
})();
</script>
</body>
</html>
